<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Dokumentasi Packing</title>
  <script src="https://unpkg.com/html5-qrcode"></script>
  <style>
    body { font-family: Arial, sans-serif; margin: 0; padding: 10px; background: #f0f2f5; padding-top: 360px; } 
    
    /* KAMERA STICKY */
    #camera-sticky { position: fixed; top: 0; left: 0; width: 100%; height: 350px; background: #000; z-index: 1000; }
    video { width: 100%; height: 100%; object-fit: contain; }
    #timer { position: absolute; bottom: 10px; right: 10px; background: rgba(255,0,0,0.7); color: white; padding: 5px 10px; border-radius: 5px; font-family: monospace; font-size: 16px; display: none; }

    .card { background: white; padding: 15px; border-radius: 10px; box-shadow: 0 2px 5px rgba(0,0,0,0.1); margin-bottom: 15px; }
    input[type="text"] { width: 93%; padding: 10px; font-size: 16px; border-radius: 6px; border: 1px solid #ccc; }
    
    /* 3 TOMBOL DALAM 1 BARIS */
    .button-grid { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 5px; margin-top: 10px; }
    button { padding: 10px 5px; border: none; border-radius: 6px; font-size: 11px; font-weight: bold; color: white; cursor: pointer; }
    button:disabled { background: #ccc !important; }
    .btn-green { background: #28a745; }
    .btn-red { background: #dc3545; }
    .btn-blue { background: #007bff; }
    
    /* PROGRESS BAR STYLING */
    #progress-container { width: 100%; background-color: #e0e0e0; border-radius: 6px; margin-top: 10px; display: none; overflow: hidden; }
    #progress-bar { width: 0%; height: 20px; background-color: #28a745; text-align: center; line-height: 20px; color: white; font-size: 11px; font-weight: bold; transition: width 0.4s ease; }
  </style>
</head>
<body>

  <div id="camera-sticky">
    <video id="preview" autoplay playsinline muted></video>
    <div id="timer">00:00</div>
  </div>

  <div class="card">
    <input type="text" id="inputResi" placeholder="Scan / Ketik Resi">
    <button class="btn-blue" onclick="startScanner()" style="width:100%; margin-top:10px;">📷 Buka Scanner</button>
    <div id="reader" style="display:none; margin-top:10px;"></div>
  </div>

  <div class="card">
    <div class="button-grid">
      <button class="btn-green" onclick="ambilFoto('SEBELUM')">Foto Sblm</button>
      <button class="btn-red" id="btnRecord" onclick="toggleRecord()">Rekam</button>
      <button class="btn-green" onclick="ambilFoto('SESUDAH')">Foto Sdh</button>
    </div>
    
    <div id="status-panel" style="margin-top:10px; font-size:12px;">
      <span id="statSebelum">Foto Sebelum: ❌</span> | 
      <span id="statVideo">Video: ❌</span> | 
      <span id="statSesudah">Foto Sesudah: ❌</span>
    </div>
  </div>

  <div class="card">
    <label style="font-size: 13px;"><input type="checkbox" id="chkConfirm" onchange="document.getElementById('btnUpload').disabled = !this.checked"> Dokumentasi lengkap.</label>
    
    <!-- TOMBOL & PROGRESS BAR -->
    <button id="btnUpload" class="btn-blue" style="background:#17a2b8; margin-top:10px;" onclick="uploadSemuaData()" disabled>☁️ Upload ke Drive</button>
    
    <div id="progress-container">
      <div id="progress-bar">0%</div>
    </div>
  </div>

<script>
  const GAS_URL = "https://script.google.com/macros/s/AKfycbyzXvNdJ4grCNrXIU-YG5gYCK0pd-jYIxvvnCbwHfXrZScnc7OoXc_v_ca5uBF16KQ/exec"; // <-- GANTI INI
  let fotoSebelum = "", videoPacking = "", fotoSesudah = "", isRecording = false;
  let mediaRecorder, recordedChunks = [], seconds = 0, timerInterval;

  async function initCamera() {
    try {
      const stream = await navigator.mediaDevices.getUserMedia({ 
        video: { 
          facingMode: { ideal: "environment" },
          width: { ideal: 854 },   // Resolusi 480p (Lebih ringan untuk durasi lama)
          height: { ideal: 480 }
        }, 
        audio: false 
      });
      document.getElementById('preview').srcObject = stream;
    } catch (e) { alert("Kamera gagal: " + e.message); }
  }
  
  window.onload = initCamera;

  function startScanner() {
    document.getElementById('reader').style.display = 'block';
    const scanner = new Html5Qrcode("reader");
    scanner.start({ facingMode: "environment" }, { 
      fps: 10, qrbox: 250, 
      formatsToSupport: [Html5QrcodeSupportedFormats.QR_CODE, Html5QrcodeSupportedFormats.CODE_128] 
    }, (t) => {
      document.getElementById('inputResi').value = t;
      scanner.stop().then(() => document.getElementById('reader').style.display = 'none');
    });
  }

  function toggleRecord() {
    const btn = document.getElementById('btnRecord');
    const timerDiv = document.getElementById('timer');
    if (!isRecording) {
      recordedChunks = []; seconds = 0;
      timerDiv.style.display = 'block'; timerDiv.innerText = "00:00";
      timerInterval = setInterval(() => {
        seconds++;
        timerDiv.innerText = `${Math.floor(seconds/60).toString().padStart(2,'0')}:${(seconds%60).toString().padStart(2,'0')}`;
      }, 1000);
      
      const options = {
        mimeType: 'video/webm',
        videoBitsPerSecond: 600000 // Kompresi ekstra pas untuk resolusi 480p
      };

      try {
        mediaRecorder = new MediaRecorder(document.getElementById('preview').srcObject, options);
      } catch (e) {
        mediaRecorder = new MediaRecorder(document.getElementById('preview').srcObject);
      }

      mediaRecorder.ondataavailable = e => { if(e.data.size > 0) recordedChunks.push(e.data); };
      mediaRecorder.start();
      isRecording = true; btn.innerText = "Stop";
    } else {
      mediaRecorder.stop();
      clearInterval(timerInterval); timerDiv.style.display = 'none';
      mediaRecorder.onstop = () => {
        const blob = new Blob(recordedChunks, { type: 'video/webm' });
        const reader = new FileReader();
        reader.readAsDataURL(blob);
        reader.onloadend = () => {
          videoPacking = reader.result;
          document.getElementById('statVideo').innerText = "Video: ✅";
        };
      };
      isRecording = false; btn.innerText = "Rekam";
    }
  }

  function captureFrame() {
    const v = document.getElementById('preview');
    const c = document.createElement('canvas');
    c.width = v.videoWidth; c.height = v.videoHeight;
    c.getContext('2d').drawImage(v, 0, 0);
    return c.toDataURL('image/jpeg', 0.7);
  }

  function ambilFoto(type) {
    if(type === 'SEBELUM') { fotoSebelum = captureFrame(); document.getElementById('statSebelum').innerText = "Foto Sebelum: ✅"; }
    else { fotoSesudah = captureFrame(); document.getElementById('statSesudah').innerText = "Foto Sesudah: ✅"; }
  }

  function uploadSemuaData() {
    const resi = document.getElementById('inputResi').value.trim();
    if (!resi || !fotoSebelum || !videoPacking || !fotoSesudah) return alert("Pastikan semua data sudah terisi!");
    
    // Nonaktifkan tombol dan tampilkan progress bar
    document.getElementById('btnUpload').disabled = true;
    document.getElementById('btnUpload').innerText = "Sedang Mengunggah...";
    const pContainer = document.getElementById('progress-container');
    const pBar = document.getElementById('progress-bar');
    pContainer.style.display = 'block';
    
    // Simulasi progress bar berjalan halus
    let progress = 10;
    pBar.style.width = progress + '%';
    pBar.innerText = progress + '%';
    
    let intervalSimulasi = setInterval(() => {
      if (progress < 90) {
        progress += 10;
        pBar.style.width = progress + '%';
        pBar.innerText = progress + '%';
      }
    }, 300);

    fetch(GAS_URL, { method: "POST", body: JSON.stringify({ resi, fotoSebelum, videoPacking, fotoSesudah }) })
    .then(r => r.json())
    .then(r => { 
        clearInterval(intervalSimulasi);
        pBar.style.width = '100%';
        pBar.innerText = '100%';
        
        if(r.status === "success") { 
            alert("✅ Berhasil tersimpan di Google Drive!"); 
            location.reload(); 
        } else { 
            alert("❌ Gagal: " + r.message); 
            resetUploadUI();
        }
    })
    .catch(err => {
        clearInterval(intervalSimulasi);
        alert("❌ Terjadi kesalahan jaringan: " + err);
        resetUploadUI();
    });
  }

  function resetUploadUI() {
    document.getElementById('btnUpload').disabled = false;
    document.getElementById('btnUpload').innerText = "☁️ Upload ke Drive";
    document.getElementById('progress-container').style.display = 'none';
    document.getElementById('progress-bar').style.width = '0%';
  }
</script>
</body>
</html>
