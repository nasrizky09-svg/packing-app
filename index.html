<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Dokumentasi Packing</title>
  <script src="https://unpkg.com/html5-qrcode"></script>
  <style>
    body { font-family: sans-serif; margin: 0; padding: 10px; background: #f0f2f5; padding-bottom: 70px; }
    .container { max-width: 500px; margin: auto; background: #fff; padding: 15px; border-radius: 8px; box-shadow: 0 2px 5px rgba(0,0,0,0.1); }
    video, canvas { width: 100%; border-radius: 6px; background: #000; }
    .btn { width: 100%; padding: 12px; margin: 5px 0; border: none; border-radius: 6px; font-weight: bold; cursor: pointer; }
    .btn-blue { background: #007bff; color: #fff; }
    .btn-green { background: #28a745; color: #fff; }
    .btn-red { background: #dc3545; color: #fff; }
    .btn:disabled { background: #ccc; cursor: not-allowed; }
    .row { display: flex; gap: 5px; }
    .row .btn { flex: 1; }
    #reader { width: 100%; display: none; margin-bottom: 10px; }
    #timer { text-align: center; font-size: 18px; font-weight: bold; color: red; display: none; margin: 5px 0; }
    .status-text { font-size: 12px; color: #555; margin: 5px 0; text-align: center; }
    
    /* Widget Antrean Bottom Bar */
    #queue-widget { position: fixed; bottom: 0; left: 0; right: 0; background: #222; color: #fff; padding: 10px 15px; font-size: 13px; z-index: 999; }
    .queue-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 5px; }
    #btnResetUpload { background: #dc3545; color: #fff; border: none; padding: 6px 12px; border-radius: 4px; font-weight: bold; cursor: pointer; font-size: 12px; }
    .progress-container { width: 100%; background-color: #444; border-radius: 4px; height: 8px; overflow: hidden; display: none; }
    .progress-bar { width: 0%; height: 100%; background-color: #28a745; transition: width 0.2s ease; }

    /* Modal Overlay Upload Langsung (Durasi > 6 Mnt) */
    #directUploadModal { display: none; position: fixed; top:0; left:0; right:0; bottom:0; background: rgba(0,0,0,0.85); color: #fff; z-index: 10000; flex-direction: column; justify-content: center; align-items: center; padding: 20px; text-align: center; }
    .modal-box { background: #333; padding: 25px; border-radius: 10px; width: 90%; max-width: 400px; }
    .modal-bar-container { width: 100%; background: #555; height: 12px; border-radius: 6px; overflow: hidden; margin: 15px 0; }
    .modal-bar { width: 0%; height: 100%; background: #007bff; transition: width 0.2s ease; }
  </style>
</head>
<body>

<div class="container">
  <video id="preview" autoplay playsinline muted></video>
  <div id="timer">00:00</div>
  <div id="reader"></div>

  <div style="margin-top: 10px;">
    <input type="text" id="inputResi" placeholder="Scan / Ketik Resi" style="width: 100%; padding: 10px; box-sizing: border-box; font-size: 16px; border: 1px solid #ccc; border-radius: 6px;">
    <button class="btn btn-blue" onclick="startScanner()">📷 Buka Scanner</button>
  </div>

  <div class="row" style="margin-top: 10px;">
    <button class="btn btn-green" onclick="ambilFoto('SEBELUM')">Foto Sblm</button>
    <button class="btn btn-red" id="btnRecord" onclick="toggleRecord()">Rekam</button>
    <button class="btn btn-green" onclick="ambilFoto('SESUDAH')">Foto Sdh</button>
  </div>

  <div class="status-text">
    <span id="statSebelum">Foto Sebelum: ❌</span> | 
    <span id="statVideo">Video: ❌</span> | 
    <span id="statSesudah">Foto Sesudah: ❌</span>
  </div>

  <hr style="margin: 15px 0; border: none; border-top: 1px solid #eee;">

  <label style="display: block; margin-bottom: 10px; font-size: 14px;">
    <input type="checkbox" id="chkConfirm" onchange="document.getElementById('btnSaveQueue').disabled = !this.checked"> Dokumentasi lengkap.
  </label>

  <button class="btn btn-green" id="btnSaveQueue" disabled onclick="simpanKeAntrean()">📦 Simpan & Lanjut Paket Berikutnya</button>
</div>

<!-- Widget Bottom Bar Antrean -->
<div id="queue-widget">
  <div class="queue-header">
    <span id="queue-status">Menghubungkan Database...</span>
    <button id="btnResetUpload" onclick="paksaMulaiAntrean()">🔁 Reset/Upload Ulang</button>
  </div>
  <div class="progress-container" id="progressContainer">
    <div class="progress-bar" id="progressBar"></div>
  </div>
</div>

<!-- Overlay Upload Langsung Durasi Panjang -->
<div id="directUploadModal">
  <div class="modal-box">
    <h3 style="margin-top:0;">⏳ Mengunggah Video Panjang</h3>
    <p id="modalText">Durasi video ≥ 6 menit. Mengirim langsung ke Drive...</p>
    <div class="modal-bar-container">
      <div class="modal-bar" id="modalProgressBar"></div>
    </div>
    <div id="modalPercent" style="font-weight: bold; font-size: 18px;">0%</div>
  </div>
</div>

<script>
  // WAJIB ISI URL WEB APP GAS KAMU (BERAKHIRAN /exec)
  const GAS_URL = "https://script.google.com/macros/s/AKfycbzHqPHlpRe1gEb6mF53sVGUEQ3XTTPkHac1cpRTs5DdHVHk0TCDChwEJDeBatmjS4p8/exec";

  let fotoSebelum = "", videoPacking = "", fotoSesudah = "", isRecording = false;
  let mediaRecorder, recordedChunks = [], seconds = 0, timerInterval;
  let lastVideoDuration = 0; // Menyimpan durasi detik rekaman terakhir
  let canvasStream, videoCanvas, canvasCtx;

  // --- DATABASE LOCAL (INDEXEDDB) ---
  let db;
  const dbRequest = indexedDB.open("PackingDB", 1);
  dbRequest.onupgradeneeded = e => {
    db = e.target.result;
    if (!db.objectStoreNames.contains("queue")) {
      db.createObjectStore("queue", { keyPath: "id", autoIncrement: true });
    }
  };
  dbRequest.onsuccess = e => {
    db = e.target.result;
    updateStatusAntreanRealtime();
    prosesAntreanUpload(); 
  };

  async function initCamera() {
    try {
      const stream = await navigator.mediaDevices.getUserMedia({ 
        video: { facingMode: { ideal: "environment" }, width: { ideal: 1080 }, height: { ideal: 1920 } }, 
        audio: false 
      });
      document.getElementById('preview').srcObject = stream;
    } catch (e) { alert("Kamera gagal: " + e.message); }
  }
  window.onload = initCamera;

  function startScanner() {
    document.getElementById('reader').style.display = 'block';
    const scanner = new Html5Qrcode("reader");
    scanner.start({ facingMode: "environment" }, { 
      fps: 10, qrbox: 250, 
      formatsToSupport: [Html5QrcodeSupportedFormats.QR_CODE, Html5QrcodeSupportedFormats.CODE_128] 
    }, (t) => {
      document.getElementById('inputResi').value = t;
      scanner.stop().then(() => document.getElementById('reader').style.display = 'none');
    });
  }

  function toggleRecord() {
    const btn = document.getElementById('btnRecord');
    const timerDiv = document.getElementById('timer');
    const videoElement = document.getElementById('preview');

    if (!isRecording) {
      recordedChunks = []; seconds = 0;
      
      videoCanvas = document.createElement('canvas');
      videoCanvas.width = 720;
      videoCanvas.height = 1280;
      canvasCtx = videoCanvas.getContext('2d');

      function drawVideoToCanvas() {
        if (!isRecording) return;
        const vW = videoElement.videoWidth || 1080;
        const vH = videoElement.videoHeight || 1920;
        const cW = videoCanvas.width;
        const cH = videoCanvas.height;

        const hRatio = cW / vW;
        const vRatio = cH / vH;
        const ratio = Math.min(hRatio, vRatio);
        
        const centerShiftX = (cW - vW * ratio) / 2;
        const centerShiftY = (cH - vH * ratio) / 2;

        canvasCtx.fillStyle = "#000000";
        canvasCtx.fillRect(0, 0, cW, cH);
        canvasCtx.drawImage(videoElement, 0, 0, vW, vH, centerShiftX, centerShiftY, vW * ratio, vH * ratio);

        requestAnimationFrame(drawVideoToCanvas);
      }
      
      canvasStream = videoCanvas.captureStream(24); // 15 FPS agar seimbang & efisien
      isRecording = true;
      requestAnimationFrame(drawVideoToCanvas);

      setTimeout(() => {
        timerDiv.style.display = 'block'; 
        timerDiv.innerText = "00:00";
        timerInterval = setInterval(() => {
          seconds++;
          timerDiv.innerText = `${Math.floor(seconds/60).toString().padStart(2,'0')}:${(seconds%60).toString().padStart(2,'0')}`;
        }, 1000);

        const options = { mimeType: 'video/webm', videoBitsPerSecond: 600000 };

        try {
          mediaRecorder = new MediaRecorder(canvasStream, options);
        } catch (e) {
          mediaRecorder = new MediaRecorder(canvasStream);
        }

        mediaRecorder.ondataavailable = e => { if(e.data.size > 0) recordedChunks.push(e.data); };
        mediaRecorder.start(100); 
        btn.innerText = "Stop";
      }, 250);

    } else {
      isRecording = false;
      lastVideoDuration = seconds; // Simpan total durasi rekaman
      if (mediaRecorder && mediaRecorder.state !== "inactive") {
        mediaRecorder.stop();
      }
      clearInterval(timerInterval); 
      timerDiv.style.display = 'none';
      
      mediaRecorder.onstop = () => {
        const blob = new Blob(recordedChunks, { type: 'video/webm' });
        const reader = new FileReader();
        reader.readAsDataURL(blob);
        reader.onloadend = () => {
          videoPacking = reader.result;
          document.getElementById('statVideo').innerText = `Video: ✅ (${Math.floor(lastVideoDuration/60)}m ${lastVideoDuration%60}s)`;
        };
      };
      btn.innerText = "Rekam";
    }
  }

  function captureFrame() {
    const v = document.getElementById('preview');
    const c = document.createElement('canvas');
    c.width = v.videoWidth; 
    c.height = v.videoHeight;
    c.getContext('2d').drawImage(v, 0, 0);
    return c.toDataURL('image/jpeg', 0.95);
  }

  function ambilFoto(type) {
    if(type === 'SEBELUM') { fotoSebelum = captureFrame(); document.getElementById('statSebelum').innerText = "Foto Sebelum: ✅"; }
    else { fotoSesudah = captureFrame(); document.getElementById('statSesudah').innerText = "Foto Sesudah: ✅"; }
  }

  function simpanKeAntrean() {
    const resi = document.getElementById('inputResi').value.trim();
    if (!resi || !fotoSebelum || !videoPacking || !fotoSesudah) return alert("Pastikan semua data terisi!");

    const dataItem = { resi, fotoSebelum, videoPacking, fotoSesudah, timestamp: new Date().getTime() };

    // AMBANG BATASE DITETAPKAN 360 DETIK (6 MENIT)
    if (lastVideoDuration >= 480) {
      // JIKA DURASI >= 6 MENIT: UPLOAD LANGSUNG (DIRECT MODE)
      uploadLangsungMode(dataItem);
    } else {
      // JIKA DURASI < 6 MENIT: MASUK ANTREAN INDEXEDDB (BACKGROUND MODE)
      const tx = db.transaction("queue", "readwrite");
      tx.objectStore("queue").add(dataItem);
      
      tx.oncomplete = () => {
        resetFormFormulir();
        updateStatusAntreanRealtime();
        prosesAntreanUpload();
      };
    }
  }

  // --- MODUS 1: UPLOAD LANGSUNG UNTUK DURASI PANJANG (DIRECT) ---
  function uploadLangsungMode(item) {
    const modal = document.getElementById('directUploadModal');
    const modalText = document.getElementById('modalText');
    const modalBar = document.getElementById('modalProgressBar');
    const modalPercent = document.getElementById('modalPercent');

    modalText.innerText = `Resi: ${item.resi}\nDurasi: ${Math.floor(lastVideoDuration/60)} mnt. Mengirim langsung ke Drive...`;
    modalBar.style.width = "0%";
    modalPercent.innerText = "0%";
    modal.style.display = "flex";

    const xhr = new XMLHttpRequest();
    xhr.open("POST", GAS_URL, true);
    xhr.timeout = 300000; // Timeout diperpanjang hingga 5 menit untuk video besar

    xhr.upload.onprogress = e => {
      if (e.lengthComputable) {
        const percent = Math.round((e.loaded / e.total) * 100);
        modalBar.style.width = percent + "%";
        modalPercent.innerText = percent + "%";
      }
    };

    xhr.onload = () => {
      modal.style.display = "none";
      if (xhr.status === 200) {
        try {
          const r = JSON.parse(xhr.responseText);
          if (r.status === "success") {
            alert(`✅ Resi ${item.resi} (Video Panjang) Berhasil Terunggah!`);
            resetFormFormulir();
          } else {
            alert(`❌ Upload Gagal: Server mengembalikan error.`);
          }
        } catch(e) {
          alert(`❌ Respon server tidak valid.`);
        }
      } else {
        alert(`❌ Error HTTP ${xhr.status}`);
      }
    };

    xhr.onerror = () => {
      modal.style.display = "none";
      alert("❌ Koneksi Terputus saat mengunggah video panjang.");
    };

    xhr.ontimeout = () => {
      modal.style.display = "none";
      alert("❌ Upload Timeout (Lebih dari 5 Menit).");
    };

    xhr.send(JSON.stringify({ 
      resi: item.resi, 
      fotoSebelum: item.fotoSebelum, 
      videoPacking: item.videoPacking, 
      fotoSesudah: item.fotoSesudah 
    }));
  }

  function resetFormFormulir() {
    fotoSebelum = ""; videoPacking = ""; fotoSesudah = ""; lastVideoDuration = 0;
    document.getElementById('inputResi').value = "";
    document.getElementById('statSebelum').innerText = "Foto Sebelum: ❌";
    document.getElementById('statVideo').innerText = "Video: ❌";
    document.getElementById('statSesudah').innerText = "Foto Sesudah: ❌";
    document.getElementById('chkConfirm').checked = false;
    document.getElementById('btnSaveQueue').disabled = true;
  }

  // --- MODUS 2: ANTREAN INDEXEDDB BACKGROUND (DURASI SINKAT < 6 MNT) ---
  let isUploading = false;

  function hitungSisaAntrean(callback) {
    if (!db) return callback(0);
    const tx = db.transaction("queue", "readonly");
    const countReq = tx.objectStore("queue").count();
    countReq.onsuccess = () => callback(countReq.result);
  }

  function updateStatusAntreanRealtime() {
    if (isUploading) return;
    hitungSisaAntrean(total => {
      if (total === 0) {
        updateQueueWidget("Antrean: 0 | Standby (Selesai)");
        setProgressBar(0, false);
      } else {
        updateQueueWidget(`Antrean: ${total} paket tersimpan | Menunggu upload...`);
      }
    });
  }

  function prosesAntreanUpload() {
    if (isUploading || !db) return;

    const tx = db.transaction("queue", "readonly");
    const store = tx.objectStore("queue");
    const getReq = store.openCursor();

    getReq.onsuccess = e => {
      const cursor = e.target.result;
      if (cursor) {
        hitungSisaAntrean(totalCount => {
          uploadDataKeGAS(cursor.value, cursor.key, totalCount);
        });
      } else {
        updateQueueWidget("Antrean: 0 | Standby (Selesai)");
        setProgressBar(0, false);
      }
    };
  }

  function paksaMulaiAntrean() {
    isUploading = false;
    updateQueueWidget("Memproses ulang antrean...");
    setProgressBar(0, false);
    setTimeout(prosesAntreanUpload, 500);
  }

  function uploadDataKeGAS(item, idDB, sisaTotal) {
    isUploading = true;
    setProgressBar(0, true);

    const xhr = new XMLHttpRequest();
    xhr.open("POST", GAS_URL, true);
    xhr.timeout = 180000;

    xhr.upload.onprogress = e => {
      if (e.lengthComputable) {
        const percent = Math.round((e.loaded / e.total) * 100);
        updateQueueWidget(`Antrean: ${sisaTotal} paket | Mengunggah Resi ${item.resi} (${percent}%)`);
        setProgressBar(percent, true);
      }
    };

    xhr.onload = () => {
      if (xhr.status === 200) {
        try {
          const r = JSON.parse(xhr.responseText);
          if (r.status === "success") {
            const tx = db.transaction("queue", "readwrite");
            tx.objectStore("queue").delete(idDB);
            tx.oncomplete = () => {
              updateQueueWidget(`✅ Resi ${item.resi} Berhasil! Memproses berikutnya...`);
              setProgressBar(100, true);
              setTimeout(() => {
                isUploading = false;
                prosesAntreanUpload();
              }, 1500);
            };
          } else {
            penangananUploadGagal(item.resi, "Respon Error Server");
          }
        } catch (err) {
          penangananUploadGagal(item.resi, "Respon JSON tidak valid");
        }
      } else {
        penangananUploadGagal(item.resi, `Server HTTP ${xhr.status}`);
      }
    };

    xhr.onerror = () => penangananUploadGagal(item.resi, "Koneksi Terputus");
    xhr.ontimeout = () => penangananUploadGagal(item.resi, "Timeout 3 Menit");

    const payload = JSON.stringify({ 
      resi: item.resi, 
      fotoSebelum: item.fotoSebelum, 
      videoPacking: item.videoPacking, 
      fotoSesudah: item.fotoSesudah 
    });

    xhr.send(payload);
  }

  function penangananUploadGagal(resi, alasan) {
    isUploading = false;
    setProgressBar(0, false);
    hitungSisaAntrean(total => {
      updateQueueWidget(`⚠️ Gagal (${resi}) - ${alasan} [Sisa ${total} antrean]. Tekan tombol merah.`);
    });
  }

  function updateQueueWidget(teks) {
    document.getElementById('queue-status').innerText = teks;
  }

  function setProgressBar(percent, show) {
    const container = document.getElementById('progressContainer');
    const bar = document.getElementById('progressBar');
    container.style.display = show ? 'block' : 'none';
    bar.style.width = percent + '%';
  }
</script>
</body>
</html>
