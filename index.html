<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Dokumentasi Packing</title>
  <script src="https://unpkg.com/html5-qrcode"></script>
  <style>
    body { font-family: sans-serif; margin: 0; padding: 10px; background: #f0f2f5; padding-bottom: 75px; }
    .container { max-width: 500px; margin: auto; background: #fff; padding: 15px; border-radius: 8px; box-shadow: 0 2px 5px rgba(0,0,0,0.1); }
    video, canvas { width: 100%; border-radius: 6px; background: #000; }
    .btn { width: 100%; padding: 12px; margin: 5px 0; border: none; border-radius: 6px; font-weight: bold; cursor: pointer; }
    .btn-blue { background: #007bff; color: #fff; }
    .btn-green { background: #28a745; color: #fff; }
    .btn-red { background: #dc3545; color: #fff; }
    .btn:disabled { background: #ccc; cursor: not-allowed; }
    .row { display: flex; gap: 5px; }
    .row .btn { flex: 1; }
    #reader { width: 100%; display: none; margin-bottom: 10px; }
    #timer { text-align: center; font-size: 18px; font-weight: bold; color: red; display: none; margin: 5px 0; }
    .status-text { font-size: 12px; color: #555; margin: 5px 0; text-align: center; }
    
    /* Widget Antrean Bottom Bar */
    #queue-widget { position: fixed; bottom: 0; left: 0; right: 0; background: #222; color: #fff; padding: 10px 15px; font-size: 13px; z-index: 9999; box-shadow: 0 -2px 8px rgba(0,0,0,0.2); }
    .queue-header { display: flex; justify-content: space-between; align-items: center; gap: 10px; }
    #queue-status { flex: 1; line-height: 1.3; }
    #btnResetUpload { background: #dc3545; color: #fff; border: none; padding: 7px 12px; border-radius: 4px; font-weight: bold; cursor: pointer; font-size: 12px; white-space: nowrap; }
    
    /* Animasi Loading Bar Halus */
    .progress-container { width: 100%; background-color: #444; border-radius: 4px; height: 6px; overflow: hidden; display: none; margin-top: 8px; }
    .progress-bar { width: 40%; height: 100%; background-color: #28a745; border-radius: 4px; animation: loadingSlide 1.5s infinite ease-in-out; }
    @keyframes loadingSlide {
      0% { transform: translateX(-100%); }
      100% { transform: translateX(300%); }
    }
  </style>
</head>
<body>

<div class="container">
  <video id="preview" autoplay playsinline muted></video>
  <div id="timer">00:00</div>
  <div id="reader"></div>

  <div style="margin-top: 10px;">
    <input type="text" id="inputResi" placeholder="Scan / Ketik Resi" style="width: 100%; padding: 10px; box-sizing: border-box; font-size: 16px; border: 1px solid #ccc; border-radius: 6px;">
    <button class="btn btn-blue" onclick="startScanner()">📷 Buka Scanner</button>
  </div>

  <div class="row" style="margin-top: 10px;">
    <button class="btn btn-green" onclick="ambilFoto('SEBELUM')">Foto Sblm</button>
    <button class="btn btn-red" id="btnRecord" onclick="toggleRecord()">Rekam</button>
    <button class="btn btn-green" onclick="ambilFoto('SESUDAH')">Foto Sdh</button>
  </div>

  <div class="status-text">
    <span id="statSebelum">Foto Sebelum: ❌</span> | 
    <span id="statVideo">Video: ❌</span> | 
    <span id="statSesudah">Foto Sesudah: ❌</span>
  </div>

  <hr style="margin: 15px 0; border: none; border-top: 1px solid #eee;">

  <label style="display: block; margin-bottom: 10px; font-size: 14px;">
    <input type="checkbox" id="chkConfirm" onchange="document.getElementById('btnSaveQueue').disabled = !this.checked"> Dokumentasi lengkap.
  </label>

  <button class="btn btn-green" id="btnSaveQueue" disabled onclick="simpanKeAntrean()">📦 Simpan & Lanjut Paket Berikutnya</button>
</div>

<!-- Widget Bottom Bar Antrean -->
<div id="queue-widget">
  <div class="queue-header">
    <span id="queue-status">Menghubungkan Database...</span>
    <button id="btnResetUpload" onclick="paksaMulaiAntrean()">🔁 Upload Ulang</button>
  </div>
  <div class="progress-container" id="progressContainer">
    <div class="progress-bar"></div>
  </div>
</div>

<script>
  // WAJIB ISI URL WEB APP GAS KAMU (DIAKHIRI /exec)
  const GAS_URL = "https://script.google.com/macros/s/AKfycbzHqPHlpRe1gEb6mF53sVGUEQ3XTTPkHac1cpRTs5DdHVHk0TCDChwEJDeBatmjS4p8/exec";

  let fotoSebelum = "", fotoSesudah = "";
  let videoPackingBlob = null; // Menyimpan video sebagai objek Blob biner murni
  let isRecording = false;
  let mediaRecorder, recordedChunks = [], seconds = 0, timerInterval;
  let lastVideoDuration = 0;
  let canvasStream, videoCanvas, canvasCtx;

  // --- DATABASE LOCAL (INDEXEDDB) ---
  let db;
  const dbRequest = indexedDB.open("PackingDB", 1);
  dbRequest.onupgradeneeded = e => {
    db = e.target.result;
    if (!db.objectStoreNames.contains("queue")) {
      db.createObjectStore("queue", { keyPath: "id", autoIncrement: true });
    }
  };
  dbRequest.onsuccess = e => {
    db = e.target.result;
    updateStatusAntreanRealtime();
    prosesAntreanUpload(); 
  };
  dbRequest.onerror = e => {
    updateQueueWidget("⚠️ Gagal membuka database lokal HP.");
  };

  async function initCamera() {
    try {
      const stream = await navigator.mediaDevices.getUserMedia({ 
        video: { facingMode: { ideal: "environment" }, width: { ideal: 1080 }, height: { ideal: 1920 } }, 
        audio: false 
      });
      document.getElementById('preview').srcObject = stream;
    } catch (e) { alert("Kamera gagal: " + e.message); }
  }
  window.onload = initCamera;

  function startScanner() {
    document.getElementById('reader').style.display = 'block';
    const scanner = new Html5Qrcode("reader");
    scanner.start({ facingMode: "environment" }, { 
      fps: 10, qrbox: 250, 
      formatsToSupport: [Html5QrcodeSupportedFormats.QR_CODE, Html5QrcodeSupportedFormats.CODE_128] 
    }, (t) => {
      document.getElementById('inputResi').value = t;
      scanner.stop().then(() => document.getElementById('reader').style.display = 'none').catch(() => {});
    });
  }

  function toggleRecord() {
    const btn = document.getElementById('btnRecord');
    const timerDiv = document.getElementById('timer');
    const videoElement = document.getElementById('preview');

    if (!isRecording) {
      recordedChunks = [];
      videoPackingBlob = null;
      seconds = 0;
      
      videoCanvas = document.createElement('canvas');
      videoCanvas.width = 720;
      videoCanvas.height = 1280;
      canvasCtx = videoCanvas.getContext('2d');

      function drawVideoToCanvas() {
        if (!isRecording) return;
        const vW = videoElement.videoWidth || 1080;
        const vH = videoElement.videoHeight || 1920;
        const cW = videoCanvas.width;
        const cH = videoCanvas.height;

        const ratio = Math.min(cW / vW, cH / vH);
        const centerShiftX = (cW - vW * ratio) / 2;
        const centerShiftY = (cH - vH * ratio) / 2;

        canvasCtx.fillStyle = "#000000";
        canvasCtx.fillRect(0, 0, cW, cH);
        canvasCtx.drawImage(videoElement, 0, 0, vW, vH, centerShiftX, centerShiftY, vW * ratio, vH * ratio);

        requestAnimationFrame(drawVideoToCanvas);
      }
      
      canvasStream = videoCanvas.captureStream(15); // 15 FPS hemat ukuran file
      isRecording = true;
      requestAnimationFrame(drawVideoToCanvas);

      setTimeout(() => {
        timerDiv.style.display = 'block'; 
        timerDiv.innerText = "00:00";
        timerInterval = setInterval(() => {
          seconds++;
          timerDiv.innerText = `${Math.floor(seconds/60).toString().padStart(2,'0')}:${(seconds%60).toString().padStart(2,'0')}`;
        }, 1000);

        const options = { mimeType: 'video/webm', videoBitsPerSecond: 300000 }; // 300 kbps

        try {
          mediaRecorder = new MediaRecorder(canvasStream, options);
        } catch (e) {
          mediaRecorder = new MediaRecorder(canvasStream);
        }

        mediaRecorder.ondataavailable = e => { if(e.data.size > 0) recordedChunks.push(e.data); };
        mediaRecorder.start(1000); // Kumpulkan chunk tiap 1 detik agar lebih stabil untuk durasi lama
        btn.innerText = "Stop";
      }, 250);

    } else {
      isRecording = false;
      lastVideoDuration = seconds;
      if (mediaRecorder && mediaRecorder.state !== "inactive") {
        mediaRecorder.stop();
      }
      clearInterval(timerInterval); 
      timerDiv.style.display = 'none';
      
      mediaRecorder.onstop = () => {
        // Gabungkan menjadi Blob biner langsung tanpa mengubah ke Base64 di RAM
        videoPackingBlob = new Blob(recordedChunks, { type: 'video/webm' });
        recordedChunks = []; // Kosongkan array chunk untuk menghemat RAM segera
        
        const ukuranMB = (videoPackingBlob.size / (1024 * 1024)).toFixed(1);
        document.getElementById('statVideo').innerText = `Video: ✅ (${Math.floor(lastVideoDuration/60)}m ${lastVideoDuration%60}s • ${ukuranMB}MB)`;
      };
      btn.innerText = "Rekam";
    }
  }

  function captureFrame() {
    const v = document.getElementById('preview');
    const c = document.createElement('canvas');
    c.width = v.videoWidth; 
    c.height = v.videoHeight;
    c.getContext('2d').drawImage(v, 0, 0);
    return c.toDataURL('image/jpeg', 0.90);
  }

  function ambilFoto(type) {
    if(type === 'SEBELUM') { 
      fotoSebelum = captureFrame(); 
      document.getElementById('statSebelum').innerText = "Foto Sebelum: ✅"; 
    } else { 
      fotoSesudah = captureFrame(); 
      document.getElementById('statSesudah').innerText = "Foto Sesudah: ✅"; 
    }
  }

  function simpanKeAntrean() {
    const resi = document.getElementById('inputResi').value.trim();
    if (!resi || !fotoSebelum || !videoPackingBlob || !fotoSesudah) {
      return alert("Pastikan resi, foto sebelum, video, dan foto sesudah sudah terisi!");
    }

    // Semua durasi (pendek maupun panjang) langsung masuk IndexedDB sebagai Blob
    const dataItem = { 
      resi: resi, 
      fotoSebelum: fotoSebelum, 
      videoPacking: videoPackingBlob, 
      fotoSesudah: fotoSesudah, 
      timestamp: Date.now() 
    };

    const tx = db.transaction("queue", "readwrite");
    tx.objectStore("queue").add(dataItem);
    
    tx.oncomplete = () => {
      resetFormFormulir();
      updateStatusAntreanRealtime();
      prosesAntreanUpload();
    };

    tx.onerror = () => {
      alert("Gagal menyimpan ke memori lokal HP. Pastikan ruang penyimpanan internal HP tidak penuh.");
    };
  }

  function resetFormFormulir() {
    fotoSebelum = ""; 
    fotoSesudah = ""; 
    videoPackingBlob = null;
    lastVideoDuration = 0;
    document.getElementById('inputResi').value = "";
    document.getElementById('statSebelum').innerText = "Foto Sebelum: ❌";
    document.getElementById('statVideo').innerText = "Video: ❌";
    document.getElementById('statSesudah').innerText = "Foto Sesudah: ❌";
    document.getElementById('chkConfirm').checked = false;
    document.getElementById('btnSaveQueue').disabled = true;
  }

  // --- LOGIKA UPLOAD BACKGROUND (BLOB -> BASE64 ON-THE-FLY) ---
  let isUploading = false;

  function hitungSisaAntrean(callback) {
    if (!db) return callback(0);
    const tx = db.transaction("queue", "readonly");
    const countReq = tx.objectStore("queue").count();
    countReq.onsuccess = () => callback(countReq.result);
  }

  function updateStatusAntreanRealtime() {
    if (isUploading) return;
    hitungSisaAntrean(total => {
      if (total === 0) {
        updateQueueWidget("Antrean: 0 | Standby (Semua Terkirim)");
        setLoadingBar(false);
      } else {
        updateQueueWidget(`Antrean: ${total} paket tersimpan | Menunggu giliran...`);
      }
    });
  }

  function prosesAntreanUpload() {
    if (isUploading || !db) return;

    const tx = db.transaction("queue", "readonly");
    const store = tx.objectStore("queue");
    const getReq = store.openCursor();

    getReq.onsuccess = e => {
      const cursor = e.target.result;
      if (cursor) {
        hitungSisaAntrean(totalCount => {
          uploadDataKeGAS(cursor.value, cursor.key, totalCount);
        });
      } else {
        updateQueueWidget("Antrean: 0 | Standby (Semua Terkirim)");
        setLoadingBar(false);
      }
    };
  }

  function paksaMulaiAntrean() {
    isUploading = false;
    updateQueueWidget("Memeriksa ulang antrean...");
    setLoadingBar(false);
    setTimeout(prosesAntreanUpload, 400);
  }

  function kirimPayloadFetch(item, idDB, base64Video) {
    const controller = new AbortController();
    const timeoutId = setTimeout(() => controller.abort(), 300000); // Timeout 5 menit untuk video panjang

    fetch(GAS_URL, {
      method: "POST",
      body: JSON.stringify({ 
        resi: item.resi, 
        fotoSebelum: item.fotoSebelum, 
        videoPacking: base64Video, 
        fotoSesudah: item.fotoSesudah 
      }),
      signal: controller.signal
    })
    .then(r => r.json())
    .then(r => {
      clearTimeout(timeoutId);
      base64Video = null; // Lepas memori Base64 segera setelah selesai
      if (r.status === "success") {
        const tx = db.transaction("queue", "readwrite");
        tx.objectStore("queue").delete(idDB);
        tx.oncomplete = () => {
          updateQueueWidget(`✅ Resi ${item.resi} Berhasil! Melanjutkan...`);
          setTimeout(() => {
            isUploading = false;
            prosesAntreanUpload();
          }, 1200);
        };
      } else {
        penangananUploadGagal(item.resi, "Respon Error Server");
      }
    })
    .catch(err => {
      clearTimeout(timeoutId);
      base64Video = null;
      penangananUploadGagal(item.resi, err.name === 'AbortError' ? 'Timeout 5 Menit' : 'Koneksi Terputus');
    });
  }

  function uploadDataKeGAS(item, idDB, sisaTotal) {
    isUploading = true;
    setLoadingBar(true);

    // Cek apakah video berupa Blob (format baru) atau string (sisa format lama jika ada)
    if (item.videoPacking instanceof Blob) {
      const ukuranMB = (item.videoPacking.size / (1024 * 1024)).toFixed(1);
      updateQueueWidget(`Antrean: ${sisaTotal} | Mengunggah ${item.resi} (${ukuranMB} MB)...`);

      const reader = new FileReader();
      reader.readAsDataURL(item.videoPacking);
      reader.onloadend = () => {
        kirimPayloadFetch(item, idDB, reader.result);
      };
      reader.onerror = () => {
        penangananUploadGagal(item.resi, "Gagal membaca file video");
      };
    } else {
      updateQueueWidget(`Antrean: ${sisaTotal} | Mengunggah ${item.resi}...`);
      kirimPayloadFetch(item, idDB, item.videoPacking);
    }
  }

  function penangananUploadGagal(resi, alasan) {
    isUploading = false;
    setLoadingBar(false);
    hitungSisaAntrean(total => {
      updateQueueWidget(`⚠️ Gagal (${resi}): ${alasan} [Sisa ${total}]. Klik Upload Ulang.`);
    });
  }

  function updateQueueWidget(teks) {
    document.getElementById('queue-status').innerText = teks;
  }

  function setLoadingBar(show) {
    document.getElementById('progressContainer').style.display = show ? 'block' : 'none';
  }
</script>
</body>
</html>
