<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Dokumentasi Packing</title>
  <script src="https://unpkg.com/html5-qrcode"></script>
  <style>
    body { font-family: Arial, sans-serif; margin: 0; padding: 15px; text-align: center; background: #f0f2f5; }
    .card { background: white; padding: 15px; border-radius: 10px; box-shadow: 0 2px 5px rgba(0,0,0,0.1); max-width: 450px; margin: auto auto 20px auto; text-align: left; }
    .card h3 { margin-top: 0; color: #007bff; border-bottom: 2px solid #007bff; padding-bottom: 5px; font-size: 16px; }
    video, img { width: 100%; border-radius: 8px; margin-top: 10px; background: #000; max-height: 250px; object-fit: contain; }
    input[type="text"] { width: 93%; padding: 10px; font-size: 16px; border-radius: 6px; border: 1px solid #ccc; }
    button { width: 100%; padding: 12px; margin-top: 10px; border: none; border-radius: 8px; font-size: 15px; font-weight: bold; color: white; cursor: pointer; }
    button:disabled { background: #ccc !important; cursor: not-allowed; }
    .btn-green { background: #28a745; }
    .btn-red { background: #dc3545; }
    .btn-blue { background: #007bff; }
    .status-badge { display: inline-block; padding: 4px 8px; border-radius: 4px; font-size: 12px; font-weight: bold; background: #eee; color: #555; margin-bottom: 5px; }
    .active-badge { background: #d4edda; color: #155724; }
    .confirm-box { background: #e9ecef; padding: 12px; border-radius: 8px; margin-top: 15px; border: 1px solid #ced4da; }
    .confirm-box label { font-size: 14px; font-weight: bold; color: #333; cursor: pointer; display: flex; align-items: center; gap: 8px; }
  </style>
</head>
<body>

  <h2>Dokumentasi Packing</h2>

  <!-- MODUL 1: SCAN RESI -->
  <div class="card">
    <h3>1. Scan / Input Resi</h3>
    <input type="text" id="inputResi" placeholder="Hasil Scan Resi">
    <div id="reader" style="display:none; margin-top:10px;"></div>
    <button class="btn-blue" onclick="startScanner()">📷 Buka Scanner Barcode</button>
  </div>

  <!-- MODUL KAMERA UTAMA (LIVE MONITOR) -->
  <div class="card">
    <h3>Kamera Utama (Live Monitor)</h3>
    <video id="preview" autoplay playsinline muted></video>
    <button class="btn-blue" onclick="initCamera()">🔴 Aktifkan Kamera Belakang</button>
  </div>

  <!-- MODUL 2: FOTO SEBELUM -->
  <div class="card">
    <h3>2. Foto Sebelum Packing</h3>
    <span id="badgeFotoSebelum" class="status-badge">Belum Ada Foto</span>
    <img id="imgSebelum" style="display:none;">
    <button class="btn-green" onclick="ambilFotoSebelum()">📸 Ambil Foto Sebelum</button>
  </div>

  <!-- MODUL 3: VIDEO PACKING -->
  <div class="card">
    <h3>3. Rekam Video Packing</h3>
    <span id="badgeVideo" class="status-badge">Belum Terekam</span>
    <button id="btnRecord" class="btn-red" onclick="toggleRecord()">📹 Mulai Rekam Video</button>
  </div>

  <!-- MODUL 4: FOTO SESUDAH & KONFIRMASI -->
  <div class="card">
    <h3>4. Foto Sesudah & Konfirmasi Upload</h3>
    <span id="badgeFotoSesudah" class="status-badge">Belum Ada Foto</span>
    <img id="imgSesudah" style="display:none;">
    <button class="btn-green" onclick="ambilFotoSesudah()">📸 Ambil Foto Sesudah</button>
    
    <hr style="margin-top:15px; border:0; border-top:1px solid #eee;">
    
    <!-- KOTAK KONFIRMASI DOKUMENTASI -->
    <div class="confirm-box">
      <label>
        <input type="checkbox" id="chkConfirm" onchange="toggleUploadButton()" style="width:18px; height:18px;">
        Saya konfirmasi dokumentasi resi, foto & video sudah lengkap.
      </label>
    </div>

    <!-- TOMBOL UPLOAD (LOCKED BY DEFAULT) -->
    <button id="btnUpload" class="btn-blue" style="background:#17a2b8;" onclick="uploadSemuaData()" disabled>☁️ Upload Dokumentasi ke Google Drive</button>
  </div>

<script>
  // PASTE URL GOOGLE APPS SCRIPT KAMU DI SINI
  const GAS_URL = "https://script.google.com/macros/s/AKfycbyzXvNdJ4grCNrXIU-YG5gYCK0pd-jYIxvvnCbwHfXrZScnc7OoXc_v_ca5uBF16KQ/exec";

  let fotoSebelum = "", videoPacking = "", fotoSesudah = "";
  let mediaRecorder, recordedChunks = [];
  let isRecording = false;

  // 1. KAMERA LIVE
  async function initCamera() {
    try {
      const stream = await navigator.mediaDevices.getUserMedia({ 
        video: { facingMode: { ideal: "environment" } }, 
        audio: false 
      });
      document.getElementById('preview').srcObject = stream;
    } catch (err) {
      alert("Gagal mengaktifkan kamera: " + err.message);
    }
  }

  // 2. SCANNER RESI
  function startScanner() {
    document.getElementById('reader').style.display = 'block';
    const html5QrCode = new Html5Qrcode("reader");
    html5QrCode.start(
      { facingMode: "environment" }, 
      { fps: 10, qrbox: 250 }, 
      (text) => {
        document.getElementById('inputResi').value = text;
        html5QrCode.stop().then(() => {
          document.getElementById('reader').style.display = 'none';
        });
      }
    ).catch(err => alert("Gagal scan: " + err));
  }

  // 3. FOTO SEBELUM
  function ambilFotoSebelum() {
    fotoSebelum = captureFrame();
    const img = document.getElementById('imgSebelum');
    img.src = fotoSebelum;
    img.style.display = 'block';
    
    const badge = document.getElementById('badgeFotoSebelum');
    badge.innerText = "✓ Foto Berhasil Ditangkap";
    badge.className = "status-badge active-badge";
  }

  // 4. VIDEO PACKING
  function toggleRecord() {
    const btn = document.getElementById('btnRecord');
    const badge = document.getElementById('badgeVideo');

    if (!isRecording) {
      recordedChunks = [];
      const stream = document.getElementById('preview').srcObject;
      if (!stream) return alert("Aktifkan kamera utama terlebih dahulu!");

      mediaRecorder = new MediaRecorder(stream, { mimeType: 'video/webm' });
      mediaRecorder.ondataavailable = e => { if(e.data.size > 0) recordedChunks.push(e.data); };
      mediaRecorder.start();

      isRecording = true;
      btn.innerText = "⏹ Selesai Rekam Video";
      badge.innerText = "🔴 Sedang Merekam...";
      badge.className = "status-badge active-badge";
    } else {
      mediaRecorder.stop();
      mediaRecorder.onstop = () => {
        const blob = new Blob(recordedChunks, { type: 'video/webm' });
        const reader = new FileReader();
        reader.readAsDataURL(blob);
        reader.onloadend = () => {
          videoPacking = reader.result;
          badge.innerText = "✓ Video Berhasil Terekam";
        };
      };
      isRecording = false;
      btn.innerText = "📹 Rekam Ulang Video";
    }
  }

  // 5. FOTO SESUDAH
  function ambilFotoSesudah() {
    fotoSesudah = captureFrame();
    const img = document.getElementById('imgSesudah');
    img.src = fotoSesudah;
    img.style.display = 'block';

    const badge = document.getElementById('badgeFotoSesudah');
    badge.innerText = "✓ Foto Berhasil Ditangkap";
    badge.className = "status-badge active-badge";
  }

  // 6. TOGGLE TOMBOL UPLOAD
  function toggleUploadButton() {
    const chk = document.getElementById('chkConfirm');
    const btn = document.getElementById('btnUpload');
    btn.disabled = !chk.checked;
  }

  // 7. UPLOAD SEMUA DATA
  function uploadSemuaData() {
    const resi = document.getElementById('inputResi').value.trim();
    if (!resi) return alert("Nomor resi belum diisi!");
    if (!fotoSebelum) return alert("Foto sebelum packing belum diambil!");
    if (!videoPacking) return alert("Video packing belum direkam!");
    if (!fotoSesudah) return alert("Foto sesudah packing belum diambil!");

    const btn = document.getElementById('btnUpload');
    btn.innerText = "⏳ Sedang Mengunggah ke Google Drive...";
    btn.disabled = true;

    fetch(GAS_URL, {
      method: "POST",
      body: JSON.stringify({
        resi: resi,
        fotoSebelum: fotoSebelum,
        videoPacking: videoPacking,
        fotoSesudah: fotoSesudah
      })
    })
    .then(res => res.json())
    .then(res => {
      if (res.status === "success") {
        alert("✅ Berhasil menyimpan semua dokumentasi ke Google Drive!");
        location.reload();
      } else {
        alert("❌ Gagal menyimpan: " + res.message);
        btn.innerText = "☁️ Upload Dokumentasi ke Google Drive";
        btn.disabled = false;
      }
    })
    .catch(err => {
      alert("❌ Error jaringan: " + err);
      btn.innerText = "☁️ Upload Dokumentasi ke Google Drive";
      btn.disabled = false;
    });
  }

  // UTILS
  function captureFrame() {
    const video = document.getElementById('preview');
    const canvas = document.createElement('canvas');
    canvas.width = video.videoWidth;
    canvas.height = video.videoHeight;
    canvas.getContext('2d').drawImage(video, 0, 0);
    return canvas.toDataURL('image/jpeg', 0.8);
  }

  // Otomatis jalankan kamera saat web dibuka
  window.onload = initCamera;
</script>
</body>
</html>
